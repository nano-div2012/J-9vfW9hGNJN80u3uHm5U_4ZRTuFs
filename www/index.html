<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#1c1c1f;--card2:#26262a;--line:#3b1218;--red:#ff2d46;--red2:#c4122a;--tx:#fff;--mut:#9a9aa2;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(180deg,var(--tint,#2b060c) 0,#000 480px) no-repeat #000;color:var(--tx);font-family:"Plus Jakarta Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:460px;margin:0 auto;padding:16px 16px 170px}
.hide{display:none!important}
h1{margin:0;font-size:34px;font-weight:800}
h2{margin:22px 0 12px;font-size:20px;font-weight:800}
input,select,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:#fff;font:16px inherit}
input:focus,button:focus-visible,select:focus{outline:2px solid var(--red);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:16px;background:var(--red);font-weight:700;font-size:16px}
.btn.w{background:#fff;color:#000;display:flex;gap:10px;justify-content:center;align-items:center}
.err{color:#ff7b7b;font-size:14px;min-height:20px;margin-top:8px}
.or{text-align:center;color:var(--mut);font-size:13px;margin:16px 0 0}
/* login */
.disc{width:150px;height:150px;border-radius:50%;margin:14px auto;background:repeating-radial-gradient(circle,#050505 0 3px,#171717 3px 5px);position:relative;box-shadow:0 0 50px #ff2d4650;animation:sp 6s linear infinite}
.disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--red)}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button,.chip{padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font-weight:700;font-size:14px;white-space:nowrap}
.tabs button{flex:1;padding:10px 4px}
.tabs .on,.chip.on{background:var(--red);border-color:var(--red);color:#fff}
/* top */
.top{display:flex;align-items:center;gap:10px}
.top h1{flex:1}
.ic{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px;color:var(--red)}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--red),#5a0a14);border:0;font-weight:800;font-size:18px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.big{flex:0 0 78%;scroll-snap-align:start;background:var(--card);border-radius:28px;overflow:hidden;cursor:pointer}
.cov{aspect-ratio:1/1;display:flex;align-items:flex-end;justify-content:space-between;padding:16px;font-weight:800;font-size:30px;line-height:1;text-shadow:0 2px 12px #0008}
.pb{width:44px;height:44px;border-radius:50%;background:#0007;display:grid;place-items:center;font-size:16px}
.big .m{padding:14px 18px 18px}
.m b{display:block;font-size:17px}.m small{color:var(--mut)}
.box{background:var(--card);border:1px solid #2a2a2e;border-radius:22px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:12px}
.box .bi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--red2)}
.box .t{flex:1;min-width:0}.box b{display:block}.box small{color:var(--mut)}
.pill{padding:10px 18px;border-radius:999px;border:0;background:var(--red);font-weight:700}
.tr{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;cursor:pointer}
.tr.cur{background:var(--card);outline:1px solid var(--red)}
.tr .c{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px}
.tr .t{flex:1;min-width:0}.tr b,.tr small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr small{color:var(--mut)}
.star{background:none;border:0;font-size:22px;color:var(--mut)}.star.on{color:var(--red)}
.post{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.ph .a{width:38px;height:38px;border-radius:50%;background:var(--red2);display:grid;place-items:center;font-weight:800}
.act{display:flex;gap:16px;margin-top:10px}.act button{background:none;border:0;color:var(--mut)}.act .on{color:var(--red)}
.prof{text-align:center;padding-top:20px}.prof .av{width:96px;height:96px;font-size:40px;margin-bottom:10px}

  <button class="mi" id="m-ed">✏️ Edit profil</button>
  ${me.pass?'<button class="mi" id="m-pw">🔒 Ubah kata sandi</button>':''}
  ${me.email?`<button class="mi" id="m-vf">✅ Verifikasi email <small style="margin-left:auto;color:var(--mut)">${me.verified?'Terverifikasi':'Belum'}</small></button>`:''}
  ${isOwner(me)?`<button class="mi" id="m-ow">👑 Panel Owner <small style="margin-left:auto;color:var(--mut)">${users.filter(x=>x.badgeReq==='pending').length} permintaan</small></button>`:(isStaff(me)?'<button class="mi" id="m-st">🛡 Panel Staf</button>':'')+(me.badge?'':`<button class="mi" id="m-bd">🔵 Ajukan centang biru <small style="margin-left:auto;color:var(--mut)">${({pending:'Menunggu',rejected:'Ditolak'})[me.badgeReq]||''}</small></button>`)}
  <label class="mi" for="m-pv" style="margin:0">🕶 Akun privat <input type="checkbox" id="m-pv" style="width:auto;margin-left:auto" ${me.private?'checked':''}></label>
  <button class="mi" id="m-out">🚪 Keluar</button>
  <button class="mi" id="m-del" style="color:#ff7b7b">🗑 Hapus akun</button>
  <p style="text-align:center;color:var(--mut);font-size:12px">Bergabung sejak ${new Date(me.joined).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</p>`);
  $('#m-ed').onclick=editP;$('#m-out').onclick=logout;$('#m-del').onclick=delA;if($('#m-ow'))$('#m-ow').onclick=ownerP;if($('#m-st'))$('#m-st').onclick=staffP;if($('#m-bd'))$('#m-bd').onclick=badgeP;
  if($('#m-pw'))$('#m-pw').onclick=pwP;if($('#m-vf'))$('#m-vf').onclick=vfP;
  $('#m-pv').onchange=e=>{me.private=e.target.checked;saveU();toast(me.private?'Akunmu sekarang privat.':'Akunmu sekarang publik.')}
}
function editP(){
  sub('Edit profil',`<div class="prof" style="padding:0"><div class="av" id="ep">${avi(me)}</div><label class="link" for="pf" style="display:inline-block;margin-top:0">Ganti foto</label><input id="pf" type="file" accept="image/*" style="display:none"></div><label for="en">Nama</label><input id="en" maxlength="40" value="${esc(me.name)}"><label for="eu">Username</label><input id="eu" maxlength="20" value="${esc(me.username)}"><label for="eb">Bio</label><input id="eb" maxlength="100" value="${esc(me.bio)}"><label>${me.email?'Email':'Nomor WhatsApp'}</label><input value="${esc(me.email||me.phone)}" disabled><div class="err" id="ee" role="alert"></div><button class="btn" id="es">Simpan</button>`);
  let ph=me.photo;
  $('#pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);ph=c.toDataURL('image/jpeg',.8);$('#ep').innerHTML=avi({photo:ph});URL.revokeObjectURL(u)};im.onerror=()=>E('ee','File bukan gambar yang valid.');im.src=u};
  $('#es').onclick=()=>{const n=$('#en').value.trim(),un=$('#eu').value.trim().toLowerCase();
    if(!n)return E('ee','Nama tidak boleh kosong.');
    if(!/^[a-z0-9_.]{3,20}$/.test(un))return E('ee','Username 3-20 karakter: huruf kecil, angka, titik, atau garis bawah.');
    if(!isOwner(me)&&(un==='dixxdev'||/^dixx\s*dev$/i.test(n)))return E('ee','Nama atau username ini dikhususkan untuk owner.');
    if(users.some(x=>x!==me&&x.username===un))return E('ee','Username sudah dipakai.');
    posts.forEach(p=>{if(p.n===me.name)p.n=n});st.set('rw_posts',posts);
    Object.assign(me,{name:n,username:un,bio:$('#eb').value.trim(),photo:ph});saveU();toast('Profil diperbarui.');go(view);profile()}
}
